# SPDX-License-Identifier: GPL-3.0-or-later
name: ci

on:
  pull_request: {}
  push:
    branches: [main]

permissions: {}

defaults:
  run:
    shell: bash

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scripts:
    name: shellcheck, actionlint, selftest
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./actions/install-tool
        with:
          tools: actionlint shellcheck

      - name: actionlint
        run: actionlint -config-file scripts/actionlint.yaml

      - name: bash -n and shellcheck
        run: |
          for f in scripts/*.sh; do bash -n "$f"; done
          shellcheck -x -P scripts --severity=style scripts/*.sh

      - name: Script self-tests
        run: scripts/selftest.sh

      - name: The Renovate configs are valid JSON
        run: jq empty default.json renovate.json

  privacy:
    name: No biometric files
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./actions/privacy-guard

  comments:
    name: Comment guard
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./actions/comments

  rust:
    name: apex-lint fmt, clippy, test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --locked
